# UC S2S — exp16 nvidia v2 config (DSI HPC)
# Adapted from /net/monsoon/bing/S2S/v2.0/config/exp16_nvidia_v2.yaml
# Used by: train.py, train_diffusion.py, train_finetune_rollout.py, inference.py

hydra:
  job:
    chdir: true
  run:
    dir: ./outputs/${now:%Y-%m-%d_%H-%M-%S}

# ---------------------------------------------------------------
# Experiment
# ---------------------------------------------------------------
name: S2S-SI
group: s2s-dev
project: Pangu-S2S
entity: binggong
exp_dir: results
output_dir: /net/monsoon/bing/physicsnemo/examples/weather/uc_s2s/results/inference_output
async_save: true
disable_save: false
nvme_dir: /tmp/scratch
fresh_start: false
mode: train
run_iter: 1
resuming: false

# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------
log_to_screen: true
log_to_wandb: true
wandb_offline: false
save_checkpoint: true
plot_animations: false

# ---------------------------------------------------------------
# Checkpoints
# ---------------------------------------------------------------
checkpoint_path_vae_c1: /net/monsoon/bing/uc_si_checkpoints/checkpoints/c1/ckpt.tar
checkpoint_path_det: /net/monsoon/bing/uc_si_checkpoints/checkpoints/determinstic/ckpt.tar
checkpoint_path_diff: /net/monsoon/bing/uc_si_checkpoints/si_c1_full_state/training_checkpoints/diff_ckpt.tar
checkpoint_path_finetune: /net/monsoon/bing/uc_si_checkpoints/rollout_finetune_finetune_rollout_crps_multipsteps/training_checkpoints/rollout_ckpt_1400.tar

# ---------------------------------------------------------------
# Data  (data_dir overridden at runtime with NVME scratch path)
# ---------------------------------------------------------------
data_dir: /net/monsoon/S2S/h5data
climatology_file: 1979-2018_mean_climatology.nc
calendar: standard
has_year_zero: false

train_year_start: 1979
train_year_end: 2018
val_year_start: 2018
val_year_end: 2019
train_year_to_year: false
data_timedelta_hours: 6
timedelta_hours: 24
sel_dates: true
lev: plev

surface_variables:
  - 2m_temperature
  - 10m_u_component_of_wind
  - 10m_v_component_of_wind
  - mean_sea_level_pressure
  - surface_pressure

upper_air_variables:
  - temperature
  - u_component_of_wind
  - v_component_of_wind
  - specific_humidity
  - geopotential

diagnostic_variables:
  - total_precipitation_24hr
  - mean_top_net_long_wave_radiation_flux

land_variables:
  - volumetric_soil_water_layer_1
  - soil_temperature_level_1
  - skin_temperature

ocean_variables:
  - sea_surface_temperature

constant_boundary_variables:
  - land_sea_mask
  - geopotential_at_surface

varying_boundary_variables:
  - toa_incident_solar_radiation

mask_fill:
  volumetric_soil_water_layer_1: 0.0
  soil_temperature_level_1: 270.0
  skin_temperature: 270.0
  sea_surface_temperature: 270.0
  sea_ice_cover: 0.0
  snow_depth: 0.0

mask_output: false
has_diagnostic: true

surface_mean: pangu_s2s_1979-2018_surface_mean.nc
surface_std: pangu_s2s_1979-2018_surface_std.nc
surface_ff_std: pangu_s2s_1979-2018_surface_std.nc
upper_air_mean: pangu_s2s_1979-2018_mean.nc
upper_air_std: pangu_s2s_1979-2018_std.nc
upper_air_ff_std: pangu_s2s_1979-2018_std.nc
boundary_mean: pangu_s2s_1979-2018_surface_mean.nc
boundary_std: pangu_s2s_1979-2018_surface_std.nc
diagnostic_mean: pangu_s2s_1979-2018_surface_mean.nc
diagnostic_std: pangu_s2s_1979-2018_surface_std.nc

# ---------------------------------------------------------------
# Training
# ---------------------------------------------------------------
batch_size: 4
num_data_workers: 1
max_epochs: 200
loss: weightedl1
lr: 0.000001
weight_decay: 3.0e-6
scheduler: CosineAnnealingLR
oc_pct_start: 0.1
oc_div_factor: 1.0e5
oc_final_div_factor: 0.00025
optimizer_type: Adam

vae_loss: true
vae_loss_weight: 0.01
early_stopping: false
save_checkpoint_freq: 5

num_inferences: 10000
num_ensemble_members: 1
forecast_lead_times: [1, 2, 10, 15, 45]

epsilon_factor: 0
ic_noise_std: 0.02
step_noise_std: 0.005
step_noise_growth: sqrt

# ---------------------------------------------------------------
# Diffusion / SI
# ---------------------------------------------------------------
diffusion_model_type: SI
source_sigma: 1.0
temperature: 1.5
valid_max_batches: 30

# ---------------------------------------------------------------
# Model
# ---------------------------------------------------------------
nettype: pangu_plasim
use_transformer_engine: false
use_reentrant: false
checkpointing: 2
patch_size: [2, 4, 4]
window_size: [2, 6, 12]
depths: [2, 6, 6, 2]
updown_scale_factor: 2
num_levels: 17
levels: [5, 10, 20, 30, 50, 70, 100, 150, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
horizontal_resolution: [180, 360]
predict_delta: false
subpixel_deconv: true
recovery_head: true
diagnostic_head: false
vertical_windowing: true
upper_air_boundary: false

component: 8
base_channels: 2
z_channels: 2

dropout_rate: 0.1
drop_rate: 0.0

diagnostic_acc: false
diagnostic_gif: false
diagnostic_spectra: false
diagnostic_logs: true

test_iterations: 10000000000


# Regional log-MSE: MSE(log1p(clamp(P,0)/eps)) in mm/day over the monsoon
# box — compresses the heavy tail so moderate/heavy intensities matter.
name: regional_log_mse
epsilon_mm: 0.1
lat_weighted: true

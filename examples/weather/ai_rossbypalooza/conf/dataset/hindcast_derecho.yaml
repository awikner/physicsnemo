# Hindcast mixture dataset — Derecho paths (Derecho copies ONLY; nothing
# reads from the DSI cluster). All experts read the unified harmonized
# stores under hindcasts_mowe/ produced by tools/harmonize_hindcasts.py
# (canonical flat names, lead_time in whole days, tp = trailing-24h
# accumulation in m — ERA5 units), so the precip axis/kind/units below are
# known by construction. `day_offset` (which IMERG day a given lead pairs
# with) is still empirically pinned by tools/verify_precip_alignment.py.

master_channels:
  - geopotential/500
  - temperature/850
  - specific_humidity/850
  - u_component_of_wind/850
  - v_component_of_wind/850
  - 2m_temperature
  - mean_sea_level_pressure
  - surface_pressure

truth:
  root: /glade/derecho/scratch/awikner/physicsnemo-zarr/imerg
  var: total_precipitation_24hr

normalization:
  dynamical_mean: /glade/derecho/scratch/awikner/physicsnemo-zarr/era5/normalization_pangu_s2s_mean.zarr
  dynamical_std: /glade/derecho/scratch/awikner/physicsnemo-zarr/era5/normalization_pangu_s2s_std.zarr
  # Written by tools/compute_precip_norm.py (IMERG train years).
  precip_stats: /glade/derecho/scratch/awikner/physicsnemo-zarr/normalization/imerg_precip_stats.zarr

experts:
  - name: pangu_s2s
    schema: harmonized
    root: /glade/derecho/scratch/awikner/hindcasts_mowe/pangu_s2s
    precip: {var: total_precipitation_24hr, axis: daily, kind: accum, units: m, day_offset: 0}
  - name: sfno_era5
    schema: harmonized
    root: /glade/derecho/scratch/awikner/hindcasts_mowe/sfno_era5
    precip: {var: total_precipitation_24hr, axis: daily, kind: accum, units: m, day_offset: 0}
  - name: graphcast
    schema: harmonized
    root: /glade/derecho/scratch/awikner/hindcasts_mowe/graphcast
    precip: {var: total_precipitation_24hr, axis: daily, kind: accum, units: m, day_offset: 0}
  - name: aifs_single_v2
    schema: harmonized
    root: /glade/derecho/scratch/awikner/hindcasts_mowe/aifs_single_v2
    precip: {var: total_precipitation_24hr, axis: daily, kind: accum, units: m, day_offset: 0}

train:
  years: [2001, 2018]
  init_months: [5, 6, 7, 8, 9]
  lead_days: [8, 14]
  min_experts: 1

val:
  years: [2019, 2021]
  init_months: [6, 7, 8, 9]
  lead_days: [8, 14]
  min_experts: 1

loader:
  batch_size: 4            # per GPU
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  shuffle: true
  num_samples_per_epoch: null   # null -> one pass over all pairs
  zarr_concurrency: 6
  nan_expert_threshold: 0.5

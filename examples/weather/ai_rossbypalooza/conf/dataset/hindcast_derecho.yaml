# Hindcast mixture dataset — Derecho paths (Derecho copies ONLY; nothing
# reads from the DSI cluster). DSI-schema experts point at the 1-degree
# stores produced by tools/regrid_dsi_to_1deg.py.
#
# !!! Every expert's `precip:` spec (axis / kind / units / day_offset) below
# is a PLACEHOLDER until pinned by tools/verify_precip_alignment.py — run it
# once on Derecho and record the verified values here and in DATA.md.

master_channels:
  - geopotential/500
  - temperature/850
  - specific_humidity/700
  - u_component_of_wind/850
  - v_component_of_wind/850
  - 2m_temperature
  - mean_sea_level_pressure

truth:
  root: /glade/derecho/scratch/awikner/physicsnemo-zarr/imerg
  var: total_precipitation_24hr

normalization:
  dynamical_mean: /glade/derecho/scratch/awikner/physicsnemo-zarr/era5/normalization_pangu_s2s_mean.zarr
  dynamical_std: /glade/derecho/scratch/awikner/physicsnemo-zarr/era5/normalization_pangu_s2s_std.zarr
  # Written by tools/compute_precip_norm.py (IMERG train years).
  precip_stats: /glade/derecho/scratch/awikner/physicsnemo-zarr/normalization/imerg_precip_stats.zarr

experts:
  - name: pangu_s2s
    schema: consolidated
    root: /glade/derecho/scratch/awikner/physicsnemo-zarr/hindcasts/pangu_s2s
    precip: {var: total_precipitation_24hr, axis: daily, kind: accum, units: mm, day_offset: 0}
  - name: sfno_era5
    schema: consolidated
    root: /glade/derecho/scratch/awikner/physicsnemo-zarr/hindcasts/sfno_era5
    precip: {var: total_precipitation_24hr, axis: daily, kind: accum, units: mm, day_offset: 0}
  - name: graphcast_e2s
    schema: dsi
    root: /glade/derecho/scratch/awikner/hindcasts_dsi_1deg/zarr/graphcast_e2s
    precip: {var: tp, axis: daily, kind: accum, units: m, day_offset: 0}
  - name: aurora_e2s
    schema: dsi
    root: /glade/derecho/scratch/awikner/hindcasts_dsi_1deg/zarr/aurora_e2s
    precip: {var: tp, axis: daily, kind: accum, units: m, day_offset: 0}
  - name: aifs_single_v1
    schema: dsi
    root: /glade/derecho/scratch/awikner/hindcasts_dsi_1deg/zarr/aifs_single_v1
    precip: {var: tp, axis: daily, kind: accum, units: m, day_offset: 0}
  - name: aifs_single_v1p1
    schema: dsi
    root: /glade/derecho/scratch/awikner/hindcasts_dsi_1deg/zarr/aifs_single_v1p1
    precip: {var: tp, axis: daily, kind: accum, units: m, day_offset: 0}
  - name: aifs_single_v2
    schema: dsi
    root: /glade/derecho/scratch/awikner/hindcasts_dsi_1deg/zarr/aifs_single_v2
    precip: {var: tp, axis: daily, kind: accum, units: m, day_offset: 0}
  - name: graphcast_wb2
    schema: dsi
    root: /glade/derecho/scratch/awikner/hindcasts_dsi_1deg/zarr/graphcast_wb2
    precip: {var: tp, axis: 6h, kind: accum, units: m, step_hours: 6, day_offset: 0}

train:
  years: [2001, 2018]
  init_months: [5, 6, 7, 8, 9]
  lead_days: [8, 14]
  min_experts: 1

val:
  years: [2019, 2021]
  init_months: [6, 7, 8, 9]
  lead_days: [8, 14]
  min_experts: 1

loader:
  batch_size: 4            # per GPU
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  shuffle: true
  num_samples_per_epoch: null   # null -> one pass over all pairs
  zarr_concurrency: 6
  nan_expert_threshold: 0.5

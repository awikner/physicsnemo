# MoWEPrecipGate architecture. input_size / in_channels / n_experts are
# derived from the dataset at runtime — only hyperparameters live here.
name: mowe_precip
params:
  patch_size: [4, 4]        # 180x360 -> 45x90 = 4050 tokens
  hidden_size: 384
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  attention_backend: timm   # transformer_engine on H100/A100 if available
  layernorm_backend: torch
  noise_dim: null           # deterministic gate (Method 0 baseline)

# Space the expert precip fields are combined in:
#   physical - invert the log transform first, so P_hat = sum_i w_i (P_i + b_i)
#              is an ARITHMETIC mean in mm/day and the loss log-transforms it
#              (per-expert biases are mm/day offsets). This is the intended
#              formulation.
#   log      - combine the standardized log channels directly, i.e. a weighted
#              GEOMETRIC mean in mm/day (structurally dry). Ablation only.
mix_space: physical

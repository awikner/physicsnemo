#
# AMIP 1981 single-year dataset config (Phase 8b test).
#
# Pairs with conf/model/amip_default.yaml. Channel groups come from the
# Zarr store's `attrs` (the dataset class introspects them); the recipe
# only needs the path + normalization stats here.

zarr_path: ${oc.env:AI_ROSSBY_DATA,/work/hdd/bdiu/awikner/physicsnemo-zarr}/amip/1981.zarr
val_zarr_path: null

# AMIP normalize_*.nc files were saved alongside the source HDF5 archive.
# They use the same NetCDF-per-variable + level coord layout PlasimNormalizer
# (now ClimateNormalizer) reads.
mean_path: ${oc.env:AI_ROSSBY_AMIP_STATS,/work/hdd/bdiu/awikner/AMIP/h5}/normalize_mean.nc
std_path: ${oc.env:AI_ROSSBY_AMIP_STATS,/work/hdd/bdiu/awikner/AMIP/h5}/normalize_std.nc
delta_std_path: null

# AMIP forcings (SST / sea-ice / TSI / CO₂) come from the prognostic store,
# not a separate boundary file — no substitution.
boundary_zarr_path: null
yearly_repeating_boundary: False
leap_boundary_zarr_path: null
non_leap_boundary_zarr_path: null

# Model timestep. Upstream amip pairs the store's 6-hourly rows with a 24-hour
# model step — every config in BOTH source repos says so (v1 `configs/*.yaml`
# incl. SI/EDM/RFM/ERDM-UNet/DDC, v2 `configs/*.yaml`):
#     data_timedelta_hours: 6      # store row spacing (this store's attr)
#     timedelta_hours: 24          # model step  ->  step_stride = 4 rows
# `forecast_lead_times` is this fork's row-level spelling of the same number, so
# it must be [4], not [1]. `timedelta_hours` below is the hours-level statement;
# `resolve_step_stride` divides it by the store's own attribute and fails if the
# two disagree. Every consumer (single-step pair, rolling window, rollout
# validation, inference) strides by it — before 2026-08-13 they walked single
# rows, i.e. trained and scored a 6-hour step against 24-hour accumulations.
forecast_lead_times: [4]
num_samples_per_epoch: null
batch_size: 1
num_workers: 4
prefetch_factor: 2
persistent_workers: True
pin_memory: True
nan_fill_default: 0.0
nan_fill_values: {}
shuffle: True

# AMIP's normalize_*.nc carries per-variable stats for surface + upper-air
# + varying-boundary + diagnostic vars. land_sea_mask / geopotential_at_surface
# (constant boundaries) are NOT normalized — they're already in a fixed
# coordinate frame the model uses as-is. Off here matches the existing
# convention from the ERA5/PLASIM recipes.
normalize_constant_boundary: False
# Diagnostic radiation/fluxes/precip have large dynamic ranges — flip this
# on once the model wiring's verified.
normalize_diagnostic: False

# --- SST forcing suite (Phase 12g) ------------------------------------------
# Inert as shipped. `sst_anomaly_channel: append|replace` derives an SST anomaly
# channel against a day-of-year climatology and divides by the ~0.6 K residual
# std instead of the ~12.3 K absolute-SST std, which is what makes the ocean
# warming trend legible (+0.40 K goes from 0.03 sigma to ~0.7 sigma).
# `scalar_forcing: global_mean_sst` routes the ocean-mean anomaly into the
# calendar row's third slot — the slot CO2 uses, so the two are mutually
# exclusive and asking for both raises.
#
# `append` adds a channel the model must list in varying_boundary_variables
# (right after SST) or ForcingPipeline.assert_matches fails on c_grid_dim.
# Build the artifact once with tools/data/amip/make_sst_climatology.py.
sst_anomaly_channel: none        # none | append | replace
scalar_forcing: auto             # auto | none | co2 | global_mean_sst
sst_anomaly_scale: anom_std      # anom_std | gm_std | kelvin (for +DT runs)
sst_scalar_scale: gm_std
sst_climatology_path: null

#
# PLASIM sim52 split: year 12 for training, year 13 for held-out validation.
# Use with training configs that enable validation/rollout to score rollouts
# on the held-out year.

# Zarr stores resolve under $AI_ROSSBY_DATA; the PLASIM sigma-stats (.nc, on a
# separate tree) under $AI_ROSSBY_PLASIM_STATS. Both fall back to the shared
# Delta locations if the env vars are unset. See the data-acquisition guide.
zarr_path: ${oc.env:AI_ROSSBY_DATA,/work/hdd/bdiu/awikner/physicsnemo-zarr}/plasim/12.zarr
val_zarr_path: ${oc.env:AI_ROSSBY_DATA,/work/hdd/bdiu/awikner/physicsnemo-zarr}/plasim/13.zarr
mean_path: ${oc.env:AI_ROSSBY_PLASIM_STATS,/work/nvme/bdiu/awikner/PLASIM/data/2100_year_sims_rerun/sim52/h5/sigma_data}/data_12-132_mean_sigma.nc
std_path: ${oc.env:AI_ROSSBY_PLASIM_STATS,/work/nvme/bdiu/awikner/PLASIM/data/2100_year_sims_rerun/sim52/h5/sigma_data}/data_12-132_std_sigma.nc
delta_std_path: null
boundary_zarr_path: null
yearly_repeating_boundary: False
leap_boundary_zarr_path: null
non_leap_boundary_zarr_path: null

# Model timestep: NOT stated here. This store is shared by two model families
# with different steps — `pangu_plasim*` steps 24 h (upstream
# `PANGU_PLASIM_H5_DERECHO_0514.yaml`) and `sfno_plasim*` steps 6 h
# (`SFNO_PLASIM_H5_DERECHO_5412.yaml`) over the same 6-hourly rows — so any
# value here would be wrong for one of them. `null` means "ask the model":
# `train_loop.model_step_rows` reads `model.timedelta_hours` and divides by this
# store's `data_timedelta_hours`, and `lead_times_for_sampler` uses the result as
# the single-step pair's lead. Set it explicitly only to override.
forecast_lead_times: null
num_samples_per_epoch: null
batch_size: 8
num_workers: 8
prefetch_factor: 2
persistent_workers: True
pin_memory: True
nan_fill_default: 0.0
nan_fill_values: {}
shuffle: True

normalize_constant_boundary: True
normalize_diagnostic: True

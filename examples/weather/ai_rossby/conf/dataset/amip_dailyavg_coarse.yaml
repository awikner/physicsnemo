#
# AMIP daily-avg PRE-COARSENED (45x90) dataset — Phase 12c.10. The
# forecaster-training store: amip_dailyavg bilinearly downsampled x4 by
# tools/data/amip/coarsen_zarr.py using the exact amip_v2 fast-store /
# x_DDC blur operator (F.interpolate bilinear, align_corners=False).
#
# Boundaries in this store are NaN-filled (SST 270 K, ice 0) then coarsened
# — self-contained for c_grid_downsample=1 runs (both streams on the
# 45x90 grid). For upstream-parity runs (full-res c_grid with the model's
# internal stride-4 conv, c_grid_downsample=4), point boundary_zarr_path at
# the matching amip_dailyavg full-res store instead.
#
# Pairs with model=amip_erdm_v2 + loss=erdm_v2. Coarsening job:
# hpc/scripts/coarsen_amip_dailyavg_derecho.pbs.

zarr_path: ${oc.env:AI_ROSSBY_DATA,/glade/derecho/scratch/awikner/physicsnemo-zarr}/amip_dailyavg_coarse/1981.zarr
val_zarr_path: null

# Per-channel scalar stats are resolution-independent — same files as the
# full-res dataset (staged in both store roots).
mean_path: ${oc.env:AI_ROSSBY_DATA,/glade/derecho/scratch/awikner/physicsnemo-zarr}/amip_dailyavg_coarse/normalize_mean_dailyavg.nc
std_path: ${oc.env:AI_ROSSBY_DATA,/glade/derecho/scratch/awikner/physicsnemo-zarr}/amip_dailyavg_coarse/normalize_std_dailyavg.nc
delta_std_path: null

# Phase 12d option (b) — UPSTREAM PAIRING (user decision 2026-08-11): the
# forcings stay at 1 degree and the model reduces them internally with its
# stride-4 conv (model.rolling_dit_kwargs.c_grid_downsample: 4). The dataset
# sources BOTH constant and varying boundaries from this store, so the whole
# c_grid is on one grid; the coarse store's own (coarsened) boundary arrays
# go unused. amip_dailyavg_boundary is the boundary-only extraction of the
# full-res store (~2.3 GB/yr vs ~58, bit-identical) — see
# tools/data/amip/extract_boundary_store.py.
boundary_zarr_path: ${oc.env:AI_ROSSBY_DATA,/eagle/lighthouse-uchicago/physicsnemo-zarr}/amip_dailyavg_boundary/1981.zarr
yearly_repeating_boundary: False
leap_boundary_zarr_path: null
non_leap_boundary_zarr_path: null

# Model timestep. Upstream amip pairs the store's 6-hourly rows with a 24-hour
# model step — every config in BOTH source repos says so (v1 `configs/*.yaml`
# incl. SI/EDM/RFM/ERDM-UNet/DDC, v2 `configs/*.yaml`):
#     data_timedelta_hours: 6      # store row spacing (this store's attr)
#     timedelta_hours: 24          # model step  ->  step_stride = 4 rows
# `forecast_lead_times` is this fork's row-level spelling of the same number, so
# it must be [4], not [1]. `timedelta_hours` below is the hours-level statement;
# `resolve_step_stride` divides it by the store's own attribute and fails if the
# two disagree. Every consumer (single-step pair, rolling window, rollout
# validation, inference) strides by it — before 2026-08-13 they walked single
# rows, i.e. trained and scored a 6-hour step against 24-hour accumulations.
forecast_lead_times: [4]
num_samples_per_epoch: null
batch_size: 1
num_workers: 4
prefetch_factor: 2
persistent_workers: True
pin_memory: True
# Boundaries were NaN-filled BEFORE coarsening — no NaN should survive in
# this store; keep the map anyway so a boundary_zarr_path override to the
# full-res store stays correct.
nan_fill_default: 0.0
nan_fill_values:
  sea_surface_temperature_monthly_interp: 270.0
  sea_ice_cover_monthly_interp: 0.0
shuffle: True

normalize_constant_boundary: False
normalize_diagnostic: True

# Phase 12d.14 — boundary NaN smoothing knobs. These are INERT for this
# store: coarsen_zarr.py fills boundary NaN before coarsening, so nothing
# NaN-shaped survives for the runtime fade to act on. The fade is applied at
# BUILD time instead (`--smooth-boundaries`, recorded in the store's
# `coarsen_boundary_fill` attr) — which is what actually matters here, since
# a coarse cell straddling a coastline averages ocean values with whatever
# fills the land side. Kept set so a boundary_zarr_path override onto a
# NaN-carrying store stays correct.
#
# These knobs ARE live now: with boundary_zarr_path set above, the forcings
# come from the NaN-carrying native-resolution store, so the runtime fade
# runs exactly where upstream's does. (Resolved 2026-08-11: the dataset now
# reads constants from the boundary store too, so mixed-resolution c_grid
# packs — it previously raised on the 45x90 vs 180x360 concat.)
smooth_nan_boundaries: True
smooth_sigma: 1.5
smooth_kernel_size: 5
smooth_n_iters: 10

# --- SST forcing suite (Phase 12g) ------------------------------------------
# Inert as shipped. `sst_anomaly_channel: append|replace` derives an SST anomaly
# channel against a day-of-year climatology and divides by the ~0.6 K residual
# std instead of the ~12.3 K absolute-SST std, which is what makes the ocean
# warming trend legible (+0.40 K goes from 0.03 sigma to ~0.7 sigma).
# `scalar_forcing: global_mean_sst` routes the ocean-mean anomaly into the
# calendar row's third slot — the slot CO2 uses, so the two are mutually
# exclusive and asking for both raises.
#
# `append` adds a channel the model must list in varying_boundary_variables
# (right after SST) or ForcingPipeline.assert_matches fails on c_grid_dim.
# Build the artifact once with tools/data/amip/make_sst_climatology.py.
sst_anomaly_channel: none        # none | append | replace
scalar_forcing: auto             # auto | none | co2 | global_mean_sst
sst_anomaly_scale: anom_std      # anom_std | gm_std | kelvin (for +DT runs)
sst_scalar_scale: gm_std
sst_climatology_path: null

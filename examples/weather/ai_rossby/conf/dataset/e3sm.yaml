#
# E3SM split: year 2041 for training, year 2045 for held-out validation.
# Speed-benchmarking config for the SFNO-E3SM training-speed optimization —
# one archived year suffices for per-batch throughput measurement (matches
# the PLASIM sim52 bench convention).
#
# Data root: paths resolve under the AI_ROSSBY_DATA env var (the converted-Zarr
# root). Set it once (e.g. `export AI_ROSSBY_DATA=/my/physicsnemo-zarr`) to
# relocate all stores; if unset it falls back to the shared Delta location,
# which delta_bdiu members can already read. Override any single path on the
# CLI, e.g. `dataset.zarr_path=/my/store.zarr`. See the data-acquisition guide.
zarr_path: ${oc.env:AI_ROSSBY_DATA,/work/hdd/bdiu/awikner/physicsnemo-zarr}/e3sm/2041.zarr
val_zarr_path: ${oc.env:AI_ROSSBY_DATA,/work/hdd/bdiu/awikner/physicsnemo-zarr}/e3sm/2045.zarr
mean_path: ${oc.env:AI_ROSSBY_DATA,/work/hdd/bdiu/awikner/physicsnemo-zarr}/e3sm/normalization_2015-2050.zarr
std_path: ${oc.env:AI_ROSSBY_DATA,/work/hdd/bdiu/awikner/physicsnemo-zarr}/e3sm/normalization_2015-2050.zarr
delta_std_path: null
boundary_zarr_path: null
yearly_repeating_boundary: False
leap_boundary_zarr_path: null
non_leap_boundary_zarr_path: null

# Model timestep: one store row. NOT cross-checked against a source config —
# `dataset=e3sm` pairs with `model=sfno_e3sm`, whose authority is the
# PanguWeather repo, which was not reachable when the 2026-08-13 stride audit
# ran. The AMIP-family E3SM configs (amip v1 `SI_E3SM.yaml` / `DDC_E3SM.yaml`)
# use a 24-hour step over 6-hourly rows; if SFNO-E3SM is meant to match them,
# this needs `forecast_lead_times: [4]` + `timedelta_hours: 24`. Left as-is
# rather than changed on a guess — see the stride table in
# docs/dev/phase12_implementation_plan.md.
forecast_lead_times: [1]
num_samples_per_epoch: null
batch_size: 4
num_workers: 8
prefetch_factor: 2
persistent_workers: True
pin_memory: True
# SST fill matches the reference config's mask_fill (270 K) — 0.0 default
# would be a physically absurd temperature for the NaN-fill substitution.
nan_fill_default: 0.0
nan_fill_values: {SST: 270.0}
shuffle: True

normalize_constant_boundary: True
normalize_diagnostic: True

# --- Node-local data staging (optional) ------------------------------------
# When True, copy every Zarr store above (train/val/normalization/boundary) to
# fast node-local disk at the start of training and read from there, instead of
# contending on the shared parallel filesystem (Delta Lustre /work/hdd) across
# ranks and concurrent jobs. The copy runs once per node (local_rank 0) with a
# large thread pool over kernel sendfile. See data_staging.py.
#
# Measured on Delta (E3SM year: ~17.5k chunk files / 30 GB, node-local /tmp):
# a warm copy is write-bound at ~2.2 GB/s to /tmp (independent of copy method
# or worker count), while the Lustre READ side scales hard with concurrency
# (~1.6 GB/s @128 workers -> ~12 GB/s @512). Concurrency's job is to hide
# cold-read latency: a full COLD year stages in ~47s @256 workers vs ~2 min
# @64 and ~7.7 min for a serial `cp` — hence the 256 default. A serial `cp -r`
# (one Lustre round-trip per file, serialized) overran a 25-min budget.
#
# Off by default (only a win when the run is data-bound and node-local disk has
# room; ~60 GB for train+val+norm here).
stage_to_local: False
stage_dir: null            # null -> $SLURM_TMPDIR / $TMPDIR / /tmp (per-job subdir)
stage_num_workers: 256     # concurrent file copies; I/O-bound, so >> CPU count is fine

#
# Top-level config for the ai_rossby training recipe.
#
# Compositional structure (Hydra groups):
#   model      — model architecture + variable-group routing
#   loss       — loss-function family (raw/lat-weighted L1/L2, +/- VAE-KL)
#   dataset    — Zarr store paths, normalization stats, batch/loader knobs
#   training   — optimizer + EMA + multi-stage curriculum (each stage names
#                its own scheduler + unroll_steps + num_epochs)
#   validation — rollout validator + ensemble settings
#
# Defaults pick the PanguPlasimLegacy + OneCycle + raw L1 + single-step
# combination that matches PanguWeather v2.0 PANGU_PLASIM_H5_DERECHO_0514.yaml.
# Override on the command line, e.g.
#   python train.py model=sfno_plasim_5412 training=sfno_plasim \
#                   dataset=plasim_sim52_year12 validation=rollout_5412

defaults:
  - _self_
  - model: pangu_plasim_legacy
  - loss: mae
  - dataset: plasim_sim52_year12
  - training: pangu_plasim_legacy
  - validation: "off"  # quoted — YAML otherwise parses bare `off` as bool False
  - sampler: from_loss   # Phase 8d: inference-only diffusion sampler. Ignored
                         # by train.py; train_diffusion.py uses cfg.loss as
                         # the training scheduler. inference.py instantiates
                         # cfg.sampler when the model is a diffusion wrapper.

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/${run_name}

run_name: pangu_plasim_legacy

# --- Run control -----------------------------------------------------------
start_epoch: 1
seed: 0
checkpoint_save_interval: 10
max_checkpoints_to_keep: 5
log_every_n_steps: 1

# --- Wandb (default logging backend) ---------------------------------------
# On by default. On rank 0 initialize_wandb runs and LaunchLogger routes all
# log_minibatch / log_epoch dicts through wandb under the 'train/' and
# 'valid/' namespaces (training loss components + validation val_loss / RMSE
# / ACC). `mode: offline` writes a local ./wandb/ run with no login or network
# — run `wandb sync ./wandb/<run>` later to upload, or set `mode: online` to
# stream live (requires `wandb login`). If the `wandb` package is not
# installed the trainer logs a warning and falls back to console logging.
# Set enabled=False to disable entirely.
#
# Multi-GPU: wandb is AUTO-DISABLED when world_size > 1 (metrics go to
# console + the bench TSV instead). wandb's background threads (service IPC /
# console capture / GPU-stats monitor) can hold the GIL inside CUDA calls and
# stall NCCL — observed hanging DDP init's first collective until the NCCL
# watchdog kills the rank (Delta 2xA40, Phase 12b), even with the
# init-on-every-rank symmetry strategy. `allow_multigpu: true` overrides the
# guard at your own risk (the every-rank machinery below then applies: only
# rank 0 uses `mode`; other ranks are forced offline so the UI shows exactly
# ONE run, and metrics are rank-0-aggregated). Diagnosis + re-enable plan:
# docs/dev/wandb_ddp_hang_fix_plan.md.
wandb:
  enabled: True
  allow_multigpu: False           # DDP guard — see comment above before flipping
  project: ai-rossby
  entity: null                    # wandb team/username; null = your default entity
  name: ${run_name}
  mode: offline                   # offline | online | disabled (rank 0 only; others nonzero_rank_mode)
  init_timeout: 300               # seconds for wandb.init; raise if rank 0 times out at launch
  # --- W2 isolation-matrix knobs (wandb_ddp_hang_fix_plan.md) — both only
  # matter when allow_multigpu=true lifts the DDP guard:
  nonzero_rank_mode: offline      # offline (thread symmetry) | disabled (non-zero ranks thread-free)
  init_after_ddp: False           # true = init wandb only after the DDP wrap's first NCCL collective

# --- Bench-time per-batch TSV emission (optional) --------------------------
# When non-null and rank 0, every training-step's loss components are
# appended to a TSV at this path. Used by benchmarks/.../sfno_plasim/.
bench:
  per_batch_tsv: null

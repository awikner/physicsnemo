#
# Byte-mirror of the rsi_sstpred_a2 retrain's resolved loss config
# (outputs/rsi_sstpred_a2/.hydra/config.yaml, 2026-08-31): identical to
# rsi_fullstack_e1.yaml except the per-channel noise scales, rebuilt for the
# 153-ch sst_pred pack. The sampler MUST mirror the training scheduler or the
# interpolant profiles silently diverge from the trained heads.
_target_: physicsnemo.experimental.diffusion.RSIScheduler
window_size: 6
num_steps: 2
solver: heun
integrator: coeff
final_denoise: false
parameterization: state
h1_precond: edm
beta: linear
beta_floor: 1.0e-3
gamma_0: 1.0
gamma_1: 0.04
gamma_profile: geometric
delta_std: 1.0
time_eps: 1.0e-3
label_mode: tau
anchor_noise: 0.0
weighting: snr_bump
P_mean: 2.0
P_std: 1.2
w_1: 1.0
w_z: 1.0
eps_scale: 0.0
eps_tmin: 0.0
eps_tmax: 1.0
noise: gaussian
l_max: 90
noise_scale_path: ${oc.env:AI_ROSSBY_DATA,/scratch/09979/awikner/physicsnemo-zarr}/norm_stats/sigma_c_sstpred153.pt
spectrum_path: null
ocean_loss_weight: 1.0

#
# Inference sampler for an A2-L checkpoint (loss/rsi_a2l.yaml trained on the
# sst_pred contract): the lag-W sample-anchor RSI scheduler. Mirrors the
# training scheduler key for key -- the interpolant profiles, the lag, the
# per-channel W-step noise scales and the readout define the process the
# heads were regressed against, so the only knobs that may differ from
# training are the sampling ones (num_steps, solver, final_denoise,
# eps_scale). test_rsi_ladder_configs.py pins the mirror.
#
# Drivers: init_frames = 12 (y_{-5} .. y_6 around the IC), and the forcing
# trajectory must carry 5 boundary frames before the IC (traj_lead) for the
# anchor-time ocean imposition; rollout.py / inference.py / the validator
# read both off the scheduler.
_target_: physicsnemo.experimental.diffusion.RSIScheduler
window_size: 6
anchor_lag: 6
num_steps: 2
solver: heun
integrator: coeff
final_denoise: false
parameterization: state
h1_precond: edm
beta: linear
beta_floor: 1.0e-3
gamma_0: 1.0
gamma_1: 0.04
gamma_profile: geometric
delta_std: 1.0
time_eps: 1.0e-3
label_mode: tau
fresh_noise_scale: 1.0
anchor_noise: 0.0
weighting: snr_bump
P_mean: 2.0
P_std: 1.2
w_1: 1.0
w_z: 1.0
eps_scale: 0.0
eps_tmin: 0.0
eps_tmax: 1.0
noise: gaussian
l_max: 90
noise_scale_path: ${oc.env:AI_ROSSBY_DATA,/scratch/09979/awikner/physicsnemo-zarr}/norm_stats/sigma_c_sstpred153_lag6.pt
spectrum_path: null
ocean_loss_weight: 1.0

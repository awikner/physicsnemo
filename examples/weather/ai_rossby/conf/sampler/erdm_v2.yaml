#
# ERDM v2 INFERENCE sampler — byte-equal to loss/erdm_v2.yaml (the same
# ERDMScheduler class serves training and sampling; nocean/ocean_grid_indices
# arrive via adopt_ocean_contract, never from here).
#
# Exists because the cascade drivers (rollout.py, climate_eval_suite's
# combined path) compose samplers by NAME from conf/sampler/, and the only
# ERDM entry there was sampler/erdm.yaml — the V1 parameters (sigma_data 0.5,
# S_churn 0, S_noise 1, alpha 1), which silently mis-sample a v2 checkpoint.

_target_: physicsnemo.experimental.diffusion.ERDMScheduler
window_size: 6
num_steps: 2
sigma_min: 0.002
sigma_max: 500.0
rho: -10.0
sigma_data: 1.0
P_mean: 2.0
P_std: 1.2
solver: heun
S_churn: 1.0
S_tmin: 0.0
S_tmax: 1000.0
S_noise: 1.5
noise: gaussian
l_max: 90
noise_scale_path: null
alpha: 0.0
# Phase 12f: relative weight of the predicted-ocean channels in the loss.
# ``nocean`` and ``ocean_grid_indices`` are NOT set here — the recipe injects
# them from the model's ``ocean_state_variables``, so the tail width and the
# c_grid indices it is read from can never disagree with the pack.
# Inert unless the model config asks for ocean channels.
ocean_loss_weight: 1.0

#
# AMIP SI_X, wCO2 variant — the contract of a REAL v1 checkpoint (2026-08-14).
#
#   SI_X_AIMIP_wCO2_interp_gaussian_42_2026-05-30T08-32-59/model_epoch=19.ckpt
#   1.25B params; translated + verified bitwise against upstream v1's own DiT
#   (max |diff| 0.0000e+00, hpc/scripts/verify_si_checkpoints_polaris.pbs).
#   That run has no ``last.ckpt`` — only model_epoch=16..19 — so 19 is the one.
#
# Sibling of ``amip_si_v_coarse.yaml``; read that file's header for why these
# exist alongside ``amip_si.yaml`` (different variable set, different grid) and
# for the data-pairing and normalization caveats. Same 151-channel state, same
# 45x90 backbone grid, same c_grid_downsample 4.
#
# Two differences, both from CO2 being present:
#   * ``global_mean_co2`` is listed in varying_boundary_variables AND named in
#     scalar_routed_boundary_variables. It is a spatially uniform map in the
#     store, so the ForcingAssembler pops it out of the gridded stream and
#     appends it to the calendar row — which is why c_grid_dim stays 5 (2
#     constant + 3 gridded) while scalar_dim goes to 3. The checkpoint's
#     ``c_grid_embed`` is Conv2d(5 -> 192): listing CO2 as a fourth gridded
#     channel would size it 6 and fail to load.
#   * wider conditioning embeddings (192/192 vs 96/32), hence 1248.85M params
#     against SI-V's 1247.77M.
#
# Pair with ``loss=si_x`` / ``sampler=si_x`` (DynamicInterpolant), not ``si``.
# Note its ``sample`` returns ``(y, model_last_pred)``; the rollout drivers
# unwrap that as of 2026-08-14 (README section 6.15).

name: AmipDiTWrapper
module: physicsnemo.experimental.models.amip_si

timedelta_hours: 24

surface_variables:
  - skin_temperature
  - surface_pressure
  - 2m_temperature
  - 2m_specific_humidity
  - 10m_u_component_of_wind
  - 10m_v_component_of_wind
upper_air_variables:
  - temperature
  - u_component_of_wind
  - v_component_of_wind
  - geopotential
  - specific_humidity
diagnostic_variables:
  - USWRFtoa_24h
  - ULWRFtoa_24h
  - USWRFsfc_24h
  - ULWRFsfc_24h
  - DSWRFsfc_24h
  - DLWRFsfc_24h
  - LHTFLsfc_24h
  - SHTFLsfc_24h
  - PRATEsfc_24h
  - hcc_24h
  - lcc_24h
  - mcc_24h
  - mn2t_24h
  - mx2t_24h
  - mxtpr_24h
constant_boundary_variables:
  - geopotential_at_surface
  - land_sea_mask
# STORED order, CO2 first — matching the checkpoint's config.yml. The NaN-fill
# needs the full list; the routing below is what removes CO2 from c_grid.
varying_boundary_variables:
  - global_mean_co2
  - DSWRFtoa_24h_lead
  - sea_surface_temperature_monthly_interp
  - sea_ice_cover_monthly_interp
scalar_routed_boundary_variables:
  - global_mean_co2

levels: [5, 7, 10, 20, 30, 50, 70, 100, 125, 150, 175, 200, 250, 300, 400,
         500, 600, 700, 800, 850, 875, 900, 925, 950, 975, 1000]
horizontal_resolution: [45, 90]
# second_of_day + day_of_year + CO2. The wrapper validates this against the
# routed list, so the two cannot drift.
scalar_dim: 3
channel_layout: v1

dit_kwargs:
  dim: 1536
  num_heads: 16
  num_blocks: 24
  patch_size: 1
  num_ca_blocks: 8
  num_output_blocks: 2
  c_grid_embed_dim: 192
  c_scalar_embed_dim: 192
  c_grid_downsample: 4
  dropout: 0.0

#
# AMIP x_DDC wrapper config (Phase 8f, F6) — :class:`XDDCWrapper` around
# the convolutional :class:`XDDCUNet` denoiser for the x_DDC
# super-resolution cascade. Unlike amip_si.yaml / amip_rfm.yaml /
# amip_erdm.yaml, there is no c_grid/c_scalar conditioning (no
# constant_boundary_variables / varying_boundary_variables /
# scalar_dim) — the model's only conditioning is the bilinear
# down-then-up-sampled low-res field itself (see
# ``XDDCWrapper.downsample_then_upsample`` /
# ``CombinedModule`` for how that field gets built).
#
# Values below mirror upstream's DDC_midway_AIMIP.yaml (the config that
# produced the two real Midway3 x_DDC checkpoints in
# phase8e_midway3_checkpoint_inventory.md).

name: XDDCWrapper
module: physicsnemo.experimental.models.amip_si

# Model timestep, in hours (2026-08-13 stride audit). The step belongs to the
# MODEL family, not the store: the same 6-hourly archive can feed a 24-hour and
# a 6-hour model. Source of truth for this one: amip v1 DDC_NCAR_AIMIP.yaml
# (every amip config, v1 and v2, steps 24 h).
# `train_loop.model_step_rows` divides it by the store's own
# `data_timedelta_hours` to get the row stride, and raises if the dataset
# config's `forecast_lead_times` disagrees.
timedelta_hours: 24

surface_variables:
  - skin_temperature
  - surface_pressure
  - 2m_temperature
  - 2m_specific_humidity
  - 10m_u_component_of_wind
  - 10m_v_component_of_wind
upper_air_variables:
  - temperature
  - u_component_of_wind
  - v_component_of_wind
  - geopotential
  - specific_humidity
diagnostic_variables:
  - USWRFtoa_24h
  - ULWRFtoa_24h
  - USWRFsfc_24h
  - ULWRFsfc_24h
  - DSWRFsfc_24h
  - DLWRFsfc_24h
  - LHTFLsfc_24h
  - SHTFLsfc_24h
  - PRATEsfc_24h
  - hcc_24h
  - lcc_24h
  - mcc_24h
  - mn2t_24h
  - mx2t_24h
  - mxtpr_24h

levels: [5, 7, 10, 20, 30, 50, 70, 100, 125, 150, 175, 200, 250, 300, 400,
         500, 600, 700, 800, 850, 875, 900, 925, 950, 975, 1000]
horizontal_resolution: [180, 360]
downsample_factor: 4
# v1 upper-air layout: variable-major, in this file's level order (changed from
# `v2` on 2026-08-14). This wrapper's backbone is XDDCUNet, the CONVOLUTIONAL
# denoiser, which exists only in amip v1 — amip_v2 deleted the conv path
# (`ae_module.py` raises NotImplementedError for anything but 'dit'). So every
# real checkpoint this config can ever load is a v1 artifact, and `v2` here
# could only ever be wrong: the translator writes the artifact's layout from
# `--source-contract`, which for this backbone is always v1.
#
# The flip moves NO parameter shape (the state dict hashes to
# ba2d45a0801366be under either layout), so nothing becomes unloadable and the
# health-gate shape digest does not move — which is exactly why
# test_config_health_gates.py now pins `channel_layout` per config as well.
# Nothing in this repo trains x_DDC (train_diffusion.py has no x_DDC branch), so
# there is no in-fork checkpoint whose packing this reinterprets.
#
# amip_x_ddc_dit.yaml is the v2 downscaler and is legitimately `v2`.
channel_layout: v1

# XDDCUNet (convolutional denoiser) kwargs forwarded through unet_kwargs.
# decoder_type: dit (DiTAE autoencoder) is not vendored — see
# tools/checkpoint_translation/amip_si.py's _xddc_wrapper_kwargs_from_hparams.
unet_kwargs:
  model_channels: 384
  channel_mult: [1, 2, 4]
  num_res_blocks: 3
  attn_levels: []
  num_heads: 8
  t_emb_dim: 256
  num_groups: 16
  dropout: 0.0

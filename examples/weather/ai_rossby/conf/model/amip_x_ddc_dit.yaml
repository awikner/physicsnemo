#
# AMIP x_DDC wrapper, DiTAE variant (Phase 12h) — the amip_v2 downscaler.
#
# Pairs with the real v2-trained checkpoint x_DDC_42_2026-08-07T09-34-49
# (project: amip_v2, decoder_type: dit). amip_x_ddc.yaml keeps the v1
# convolutional denoiser for the frozen v1 family; this one is the v2 path.
#
# Original header follows.
#
# AMIP x_DDC wrapper config (Phase 8f, F6) — :class:`XDDCWrapper` around
# the convolutional :class:`XDDCUNet` denoiser for the x_DDC
# super-resolution cascade. Unlike amip_si.yaml / amip_rfm.yaml /
# amip_erdm.yaml, there is no c_grid/c_scalar conditioning (no
# constant_boundary_variables / varying_boundary_variables /
# scalar_dim) — the model's only conditioning is the bilinear
# down-then-up-sampled low-res field itself (see
# ``XDDCWrapper.downsample_then_upsample`` /
# ``CombinedModule`` for how that field gets built).
#
# Values below mirror upstream's DDC_midway_AIMIP.yaml (the config that
# produced the two real Midway3 x_DDC checkpoints in
# phase8e_midway3_checkpoint_inventory.md).

name: XDDCWrapper
module: physicsnemo.experimental.models.amip_si

# Model timestep, in hours (2026-08-13 stride audit). The step belongs to the
# MODEL family, not the store: the same 6-hourly archive can feed a 24-hour and
# a 6-hour model. Source of truth for this one: amip v1 DDC_NCAR_AIMIP.yaml
# (every amip config, v1 and v2, steps 24 h).
# `train_loop.model_step_rows` divides it by the store's own
# `data_timedelta_hours` to get the row stride, and raises if the dataset
# config's `forecast_lead_times` disagrees.
timedelta_hours: 24

surface_variables:
  - skin_temperature
  - surface_pressure
  - 2m_temperature
  - 2m_specific_humidity
  - 10m_u_component_of_wind
  - 10m_v_component_of_wind
upper_air_variables:
  - temperature
  - u_component_of_wind
  - v_component_of_wind
  - geopotential
  - specific_humidity
diagnostic_variables:
  - USWRFtoa_24h
  - ULWRFtoa_24h
  - USWRFsfc_24h
  - ULWRFsfc_24h
  - DSWRFsfc_24h
  - DLWRFsfc_24h
  - LHTFLsfc_24h
  - SHTFLsfc_24h
  - PRATEsfc_24h
  - hcc_24h
  - lcc_24h
  - mcc_24h
  - mn2t_24h
  - mx2t_24h
  - mxtpr_24h

levels: [5, 7, 10, 20, 30, 50, 70, 100, 125, 150, 175, 200, 250, 300, 400,
         500, 600, 700, 800, 850, 875, 900, 925, 950, 975, 1000]
horizontal_resolution: [180, 360]
downsample_factor: 4
# Phase 12b: amip_v2 upper-air layout (level-major, 1000 hPa first).
# Use channel_layout: v1 for wrappers meant to load real v1 checkpoints
# (the translator's --source-contract v1 sets this automatically).
channel_layout: v2

# DiTAE (transformer denoiser) — the ONLY x_DDC denoiser amip_v2 still has;
# upstream's ae_module.py raises NotImplementedError for anything but 'dit'.
# Geometry mirrors the real v2 checkpoint x_DDC_42_2026-08-07T09-34-49, whose
# config.yml states in_channels 302 / out_channels 151 explicitly — both are
# DERIVED here from the variable lists (2 x 151, 151), so a mismatch surfaces.
decoder_type: dit
dit_kwargs:
  dim: 1024
  num_heads: 16
  num_blocks: 20
  patch_size: 4
  unpatch: vanilla
  dropout: 0.0

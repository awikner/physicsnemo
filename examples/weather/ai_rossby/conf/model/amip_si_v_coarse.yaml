#
# AMIP SI (velocity variant) — the contract of a REAL v1 checkpoint (2026-08-14).
#
#   SI_AIMIP_interp_gaussian_v_42_2026-06-02T20-10-55
#   1.25B params; translated + verified bitwise against upstream v1's own DiT
#   (max |diff| 0.0000e+00, hpc/scripts/verify_si_checkpoints_polaris.pbs).
#
# Why this file exists when ``amip_si.yaml`` already does: they describe
# DIFFERENT models. ``amip_si.yaml`` is the earlier AMIP variable set — 16
# surface variables including soil/snow/dewpoint, 161 channels, and the DiT
# running at the full 180x360 data grid. The real checkpoints on Derecho are the
# daily-avg ERA5 set (6 surface / 5 upper-air x 26 levels / 15 diagnostic = 151)
# on a **45x90 backbone grid** with native-resolution forcings. Loading one
# against the other is not a near miss; it is a different architecture.
#
# The geometry below is copied from the checkpoint's own config.yml, and every
# width the wrapper derives agrees with what that file states by hand:
#     in_channels 302 (= 151 x 2, [x_noised, cond] concatenated)
#     out_channels 151   c_grid_dim 5   scalar_dim 2   nlat/nlon 45 x 90
#
# ``channel_layout: v1`` is load-bearing. This is a frozen v1 family and the
# weights are channel-indexed in UPSTREAM's order — state
# [surface | diagnostic | upper_air] with the upper-air block variable-major.
# The wrapper's default is ``fork`` ([surface | upper_air | diag]), which no
# upstream checkpoint matches: it loads cleanly, moves no shape, and is wrong
# everywhere. See README section 6.2.
#
# DATA PAIRING (this is the part ``amip_si.yaml`` gets wrong for these weights):
# a 45x90 state with c_grid_downsample 4 means the forcings arrive at 180x360
# and the backbone's strided conv reduces them — upstream's own layout, and the
# same shape as ``amip_erdm_v2``. So pair with the pre-coarsened store plus a
# native-resolution boundary store:
#     dataset=amip_dailyavg_coarse   (45x90 state; boundary_zarr_path -> 1 degree)
# NOT ``dataset=amip_1981``, which serves a native-resolution state.
#
# CAVEAT ON THE DATA: this model was trained on the 6-HOURLY AMIP archive
# (``data_dir /project/pedramh/AMIP/h5``, ``normalize_mean_interp.nc``), not on
# daily averages. Running it against ``amip_dailyavg_coarse`` is an
# implementation A/B — does our stack reproduce upstream's on identical inputs —
# and NOT a skill evaluation. The normalization statistics differ, so the
# forecasts are not expected to be meteorologically good.

name: AmipDiTWrapper
module: physicsnemo.experimental.models.amip_si

# Model timestep, in hours. The checkpoint's config states timedelta_hours 24
# over data_timedelta_hours 6, i.e. 4 store rows per step.
timedelta_hours: 24

surface_variables:
  - skin_temperature
  - surface_pressure
  - 2m_temperature
  - 2m_specific_humidity
  - 10m_u_component_of_wind
  - 10m_v_component_of_wind
upper_air_variables:
  - temperature
  - u_component_of_wind
  - v_component_of_wind
  - geopotential
  - specific_humidity
diagnostic_variables:
  - USWRFtoa_24h
  - ULWRFtoa_24h
  - USWRFsfc_24h
  - ULWRFsfc_24h
  - DSWRFsfc_24h
  - DLWRFsfc_24h
  - LHTFLsfc_24h
  - SHTFLsfc_24h
  - PRATEsfc_24h
  - hcc_24h
  - lcc_24h
  - mcc_24h
  - mn2t_24h
  - mx2t_24h
  - mxtpr_24h
constant_boundary_variables:
  - geopotential_at_surface
  - land_sea_mask
# Exactly the checkpoint's list: no global_mean_co2 in this run (scalar_dim 2 =
# the bare calendar row). Its wCO2 sibling is amip_si_x_wco2_coarse.yaml.
varying_boundary_variables:
  - DSWRFtoa_24h_lead
  - sea_surface_temperature_monthly_interp
  - sea_ice_cover_monthly_interp
scalar_routed_boundary_variables: []

levels: [5, 7, 10, 20, 30, 50, 70, 100, 125, 150, 175, 200, 250, 300, 400,
         500, 600, 700, 800, 850, 875, 900, 925, 950, 975, 1000]
# The BACKBONE grid, not the data's. The wrapper hands this straight to
# AmipDiT's nlat/nlon, and the checkpoint says 45x90.
horizontal_resolution: [45, 90]
# second_of_day + day_of_year. Nothing routed out of the grid stream.
scalar_dim: 2
channel_layout: v1

dit_kwargs:
  dim: 1536
  num_heads: 16
  num_blocks: 24
  patch_size: 1
  # Cross-attention blocks over the (c_grid, c_scalar) context, then a couple of
  # output blocks — both present in this checkpoint and both load-bearing for
  # the parameter count (1247.77M).
  num_ca_blocks: 8
  num_output_blocks: 2
  c_grid_embed_dim: 96
  c_scalar_embed_dim: 32
  # The forcings arrive at 4x the state grid (180x360 -> 45x90 via a stride-4
  # conv). This is upstream's pairing; the wrapper's own default is 1, which
  # would build a 1x1 conv and silently expect native-resolution forcings.
  c_grid_downsample: 4
  dropout: 0.0

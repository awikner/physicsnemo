#
# AMIP SI_X wrapper — same :class:`AmipDiTWrapper` as ``amip_si.yaml`` but
# paired with the x-prediction :class:`DynamicInterpolant` scheduler via
# ``loss=si_x``.
# Backbone hyperparams are identical to ``amip_si.yaml`` — the difference
# between SI and SI_X is the scheduler, not the network.
#
# FROZEN on the amip-v1 contract (Phase 12): upstream amip_v2 deleted this
# family, so this config receives no amip_v2 rebaseline changes. Kept so
# translated v1 checkpoints stay runnable. See
# docs/dev/phase12_implementation_plan.md ("dual-contract seam").

defaults:
  - amip_si

name: AmipDiTWrapper

# Model timestep, in hours (2026-08-13 stride audit). The step belongs to the
# MODEL family, not the store: the same 6-hourly archive can feed a 24-hour and
# a 6-hour model. Source of truth for this one: amip v1 SI_NCAR_AIMIP_V.yaml
# (every amip config, v1 and v2, steps 24 h; also inherited from amip_si).
# `train_loop.model_step_rows` divides it by the store's own
# `data_timedelta_hours` to get the row stride, and raises if the dataset
# config's `forecast_lead_times` disagrees.
timedelta_hours: 24

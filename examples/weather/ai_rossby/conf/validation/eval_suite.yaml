#
# Long-horizon climate eval suite (Phase 8f, F5) — climatology / bias /
# QBO / global-mean flux / ensemble-envelope validators against a
# trained AMIP diffusion checkpoint. Run standalone via:
#
#   python eval_diffusion.py model=amip_si loss=si dataset=amip_dailyavg_coarse \
#       validation=eval_suite \
#       +eval_suite.checkpoint_dir=./outputs/amip_si_run/checkpoints \
#       +eval_suite.output_path=./outputs/amip_si_run/eval_suite.pt
#
# The ``# @package eval_suite`` directive on line 1 is load-bearing (added
# 2026-08-14): this file is selected through the ``validation`` group, but
# eval_diffusion.py reads ``cfg.eval_suite``. Without the directive the content
# lands at ``cfg.validation`` and the script raises "eval_suite.* config block
# missing" — i.e. the invocation documented here never worked. It must stay the
# FIRST line; Hydra does not look for it further down the header.
#
# Each sub-block below maps 1:1 to a validator class in eval_diffusion.py
# (docstrings there explain the metric). Every sub-block is independently
# toggled via ``enabled`` — turn off what you don't need to save GPU time
# (each aggregator pays its own full ``eval_suite.horizon``-length
# rollout unless the underlying scheduler/model instance is shared and
# cheap to reuse; the F5 live-validation test should confirm actual
# wall-time on Delta).
#
# ``eval_suite.sampler_num_steps`` is forwarded to
# DiffusionRolloutValidator's per-emitted-frame sampler schedule
# (Phase 8f, F4) — a single int applies uniformly; a list of length
# ``horizon`` gives a per-frame schedule. Capping this is what makes a
# 1-year+ rollout tractable at eval time.
#
# BIN WIDTHS ARE DERIVED (2026-08-14). Each aggregator block below states
# ``months_per_bin`` — a physical duration — and eval_diffusion.py converts it
# to a step count via ``train_loop.steps_per_month``, i.e. from
# ``cfg.model.timedelta_hours`` and the store's own cadence. One monthly bin is
# 30 steps at the AMIP 24-hour step and 122 at a 6-hour one, and neither number
# appears here. Before this, ``steps_per_bin: 120`` was hard-coded with the
# comment "≈ 1 month", which is true only for a 6-hourly model: every AMIP
# "monthly" climatology was silently binned four months wide. Setting
# ``steps_per_bin`` explicitly still wins (for a deliberately non-calendar bin)
# and logs a warning saying the bins are not the stated width.

# Rollout length for every enabled validator, in MODEL STEPS — 1460 is ~1 year
# at a 6-hour step and ~4 years at the AMIP 24-hour one. It is not derived,
# because a multi-year archive legitimately supports either; a horizon longer
# than the store can serve now raises in ``_select_ic_indices`` (it used to
# select zero ICs and report a perfect RMSE of 0.0). For a single-year AMIP
# store at 24 h, pass ``eval_suite.horizon=365``.
#
# Note that ``n_bins x months_per_bin`` is what the binned aggregators actually
# cover: 12 monthly bins span ~1 year, so a longer ``horizon`` keeps rolling but
# stops accumulating into bins past the twelfth. Match them deliberately.
horizon: 1460
max_initial_conditions: 1
ic_stride: 9999
batch_size: 1
# ``null`` (uniform, scheduler default) | int | list[int] of length `horizon`.
sampler_num_steps: 4     # ignored (with an info log) for deterministic checkpoints
# Rank-0 partial progress snapshots, every N scored frames (0 disables).
# LOCAL-ONLY finalize — zero collectives, so it cannot desync ranks: exact
# under member-split ensembles (each rank's accumulators are already
# cross-rank complete), rank-0's ICs only under IC-split (flagged in the
# saved "_progress" block).
partial_save_every_frames: 365

climatology:
  enabled: True
  n_bins: 12            # 12 x 1 month = a monthly climatology over ~1 year
  months_per_bin: 1.0
  steps_per_bin: null   # derived; set an int to override (see the header)

# Legacy alias: global_bias is ALWAYS emitted with the climatology scorer
# (it costs milliseconds; the old BiasValidator re-ran the whole rollout for
# it). This toggle only matters when climatology.enabled is False — it then
# runs the scorer with track_bins=false (means/bias/global_bias, no per-bin
# maps). bias.n_bins / months_per_bin / steps_per_bin are DEPRECATED (the
# climatology block's values are used; a disagreeing bias.n_bins warns).
bias:
  enabled: True

qbo:
  enabled: True
  # Must name a channel in ``model.upper_air_variables`` — QBOValidator raises
  # otherwise. Every ai-rossby config (v1 and v2) calls the zonal wind
  # ``u_component_of_wind``; the CMIP spelling ``ua`` that used to sit here
  # matched nothing and made a bare run unusable.
  u_variable_name: u_component_of_wind
  levels: [10, 30, 50]   # hPa — must match entries in model.levels
  months_per_bin: 1.0    # also the unit the reported period estimate is in
  steps_per_bin: null

global_mean:
  enabled: True
  # Each name is looked up against ``model.surface_variables`` then
  # ``model.diagnostic_variables``, and an unknown one raises. The TOA fluxes
  # are diagnostics in every AMIP config; ``DSWRFtoa``, which used to sit here,
  # is a *varying boundary* in the v1 configs and so was never eligible.
  flux_variables: [USWRFtoa_24h, ULWRFtoa_24h]

# ensemble_envelope: REMOVED. Spread and spread_skill are emitted
# automatically whenever the top-level ensemble_size below is > 1 — one
# shared rollout, one ensemble for the whole suite. A leftover
# ensemble_envelope block in a user config is tolerated with a loud
# deprecation warning; its ensemble_size/perturber keys are IGNORED.

# ── ensemble over GPUs ────────────────────────────────────────────────────
# TOTAL ensemble size shared by every validator above. Under torchrun with
# N > 1 ranks the members are split EVENLY across the ranks (ensemble_size %
# world_size must be 0 — the suite raises otherwise); each rank rolls the
# SAME initial conditions with its slice of the members, and the per-step
# ensemble statistics are completed by cross-rank reductions. The
# ensemble_envelope block's own ensemble_size/perturber keys override these
# for that validator only.
ensemble_size: 1
# null = validator default | replicate_only | gaussian_ic. NOTE: an ensemble
# on a DETERMINISTIC checkpoint requires gaussian_ic — replicate_only would
# produce E identical members and exactly zero spread (the driver raises).
perturber: null
perturber_scales: {}

# ── upstream-parity knobs (Combined-cascade bias protocol) ────────────────
# Pin the (single) initial condition to a calendar date (YYYY-MM-DD, 00Z),
# resolved against the store's own time coordinate. null = the default
# earliest-admissible-IC behavior.
ic_date: null
# Solver steps for the downscaler stage on the combined path; null = the
# downscaler sampler config's own num_steps (x_ddc: 5).
downscaler_num_steps: null
# Bilinear factor for downsampling the oracle init window when the drive's
# dataset is a finer grid than the forecaster's; null = the downscaler's own
# downsample_factor on the combined path, off otherwise.
init_downsample_factor: null
# Upstream bias.py's headline table: lat-weighted mean + RMSE of the
# time-mean bias per field. Entries are [label, variable, level-hPa|null];
# null variables list = upstream's default nine fields.
headline:
  enabled: False
  variables: null

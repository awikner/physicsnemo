#
# Ablation A2-L-HN -- rsi_a2l (lag-W sample anchor) plus the HIGH-NOISE LOSS
# BOOST, the RSI half of the corrected batch-40 pair. Byte-equal to
# rsi_a2l.yaml except the three hn_* keys.
#
# The boost is the same knob and the same helper as loss/erdm_v2_hn.yaml (see
# that file for the measurement that motivates it), but it is applied in
# SIGMA_EFF units -- sigma_eff(tau) = gamma(tau) / (beta(tau) * delta_std),
# the scalar that plays sigma's role in RSI's snr_bump weighting -- and
# sigma_eff is a different coordinate from ERDM's sigma. Measured per-slot
# profile at the A2-L settings (gamma 1.0 -> 0.04 geometric, W = 6):
#
#   slot            1       2       3       4       5       6
#   sigma_eff   .04-.08 .08-.18 .18-.40  .40-1.0  1.0-3.5  3.5-1e3
#   weight        0.481   0.530   0.409   0.231   0.122   0.037
#
# i.e. RSI's weighting is already nearly FLAT (13x front-to-back, against
# ERDM's ~2700x): the severity of the A0 finding is mostly an artifact of
# ERDM's rho = -10 schedule, not of rolling training as such. Consequently the
# A0-HN values (hn_sigma 10, hn_power 1.1) would be nearly inert here -- slot
# 6's weight mass sits at sigma_eff 3.5-10, right at the f peak, and the huge
# sigma_eff values only occur in a vanishing tau sliver near the beta floor.
#
# hn_sigma 3.5 / hn_power 1.0 / hn_clip 3.0 -- a MUCH gentler boost than
# A0-HN's, and measured, not guessed. Frozen-weight profile of the A2-L
# epoch-22 weights over 312 (batch, rank) samples (job 7626157, ABL=a2l with
# ABL_LOSS_DIAG=1, i.e. the control loss):
#
#   slot            1       2       3       4       5       6
#   sigma_eff   0.058   0.121   0.266   0.643   1.89    28.2
#   weight      0.479   0.531   0.412   0.234   0.124   0.039
#   share of
#   the loss    8.18%  18.45%  24.77%  22.29%  18.08%  8.23%  (+-0.3%)
#
# **A2-L's top slot already carries 8.2% of the realized weighted loss --
# 5.7x ERDM's 1.44%.** It barely has the pathology that motivates A0-HN, which
# is the measured form of "RSI's weighting is already nearly flat". So the
# correction it needs is small: this setting lifts slot 6 x1.85 to a 14.2%
# share, matching A0-HN's measured 13.9%, for a total-loss cost of x1.07
# (A0-HN pays x1.158). Slots 1-5 stay at exactly x1.000; the mean loss WEIGHT
# ratio on slot 6 is x1.77 (pinned by
# test_hn_boosts_only_the_back_slot_at_the_a2l_settings).
#
# The pair is therefore controlled where it matters -- both runs end with
# ~14% of the loss on their highest-noise slot -- even though the correction
# MAGNITUDES differ 6x, because their starting points differ 5.7x. An earlier
# attempt at 3.5/3.0/30 (matching A0's multiplier instead of its endpoint)
# would have put 46% of A2-L's loss on one slot and inflated the total x1.71.
#
# Multiplier: 1.000 up to sigma_eff 3.5, 1.43 at 5, 2 at 7, 3 (capped) above
# 10.5.
#
# Pair with model=amip_rsi_sst_pred, recipe bundle, and compare against the
# uncorrected A2-L control (checkpoints_a2l_sstpred_b40) at matched epochs.
# The weighting is training-only: an A2-L-HN checkpoint is scored with the
# shipped sampler/rsi_a2l_sstpred.yaml (pinned by test_rsi_ladder_configs).
defaults:
  - rsi_a2l
  - _self_

hn_sigma: 3.5
hn_power: 1.0
hn_clip: 3.0

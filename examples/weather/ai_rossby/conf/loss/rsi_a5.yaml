#
# Ablation A5 — the eps-family SDE sampling sweep, applied to the best of
# A2-A4. This is a SAMPLER-side ablation: eps(tau) is a post-hoc dial, so the
# whole sweep runs against an already-trained checkpoint at zero retraining
# cost. Use it as `sampler=`, not `loss=`, on a trained run:
#
#   python eval_diffusion.py ... sampler=rsi_a5 sampler.eps_scale=0.05
#
# eps_scale = 0 is the deterministic probability-flow rollout (stochasticity
# then enters only through the entering-slot perturbation Gamma_0 z), and any
# eps >= 0 preserves the marginals in the exact-score limit. Tune against
# spread-skill ratio and rank histograms per lead-time band.
defaults:
  - rsi
  - _self_

eps_scale: 0.05
# How eps(tau) is shaped. gamma2 = eps_scale * Gamma(tau)^2, diagonal in
# Gamma's basis: the drift is then -eps_scale dtau Gamma zhat and the noise
# sqrt(2 eps_scale dtau) Gamma dW, both bounded and mutually consistent. The
# legacy "scalar" mode is NOT runnable at real per-channel scales (its drift is
# stiff as 1/(gamma S_c) against channel-blind noise and diverges for the slow
# channels). Inert while eps_scale is 0.
eps_mode: gamma2
eps_tmin: 0.0
eps_tmax: 1.0
